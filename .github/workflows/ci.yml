name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: Python lint, tests, and evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        run: python -m pip install -e "./apps/api[dev]"
      - name: Ruff
        run: ruff check apps/api evals
      - name: Pytest
        run: pytest apps/api/tests
      - name: Evals
        run: python evals/run_eval.py

  web:
    name: Web lint, typecheck, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
